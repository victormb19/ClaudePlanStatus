[ui]
# Cada cuántos segundos refrescar (mín 15). Anthropic actualiza los % cada
# pocos minutos, así que 60s es un buen balance.
poll_seconds = 60

# Umbrales de aviso (icono amarillo) y alerta (icono rojo) sobre el % más alto
# entre la ventana de 5h y la semanal.
warn_pct = 70
alert_pct = 90

# Mostrar líneas extra en el menú con caps adicionales (extra_usage, opus 7d,
# sonnet 7d) cuando estén presentes en tu plan.
show_extras = true
