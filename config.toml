[limits]
# Umbral de tokens para la ventana rodante de 5h (proxy del cap de tu plan).
# "auto" usa el mayor bloque histórico ya consumido como referencia.
# Pon un número (p.ej. 50000000) para fijarlo manualmente.
threshold_5h = "auto"

# Umbral de tokens para la semana actual (lunes-domingo UTC).
# Ajústalo tras una semana de uso real con datos reales de tu plan.
threshold_weekly = 5000000

[ui]
# Cada cuántos segundos refrescar los datos.
poll_seconds = 30

# Mostrar coste estimado en el menú.
show_cost = true
